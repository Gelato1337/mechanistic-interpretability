# Publishes the topic-feature gallery (gallery/site/) with GitHub Pages.
# Repository settings -> Pages -> Source: "GitHub Actions".
name: gallery
on:
  push:
    branches: [main]
    paths: ["gallery/site/**"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: gallery/site
      - id: deployment
        uses: actions/deploy-pages@v4
